<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intro component with sign up form</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN (설정으로 Poppins 폰트 적용) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'sans-serif'] }
        }
      }
    }
  </script>
</head>

<body
  class="min-h-screen font-sans bg-[hsl(0,100%,74%)] bg-[url('images/bg-intro-mobile.png')] min-[1024px]:bg-[url('images/bg-intro-desktop.png')] bg-cover bg-center bg-no-repeat box-border">

  <main class="w-full max-w-[1113px] min-h-screen mx-auto box-border
           flex flex-wrap items-center
           p-6
           min-[768px]:max-[1065px]:flex-col min-[768px]:max-[1065px]:items-center min-[768px]:max-[1065px]:justify-center
           min-[1066px]:py-[121px] min-[1066px]:px-0">

    <!-- 소개 영역 (왼쪽) -->
    <section aria-label="Introduction" class="w-full
             min-[768px]:max-[1065px]:w-full min-[768px]:max-[1065px]:max-w-[525px] min-[768px]:max-[1065px]:min-w-0 min-[768px]:max-[1065px]:text-center min-[768px]:max-[1065px]:mb-16
             min-[1066px]:w-[525px]
             max-[767px]:text-center">
      <h1
        class="w-[525px] h-[131px] text-[50px] leading-[110%] tracking-[-0.5px] font-bold text-white text-left mb-4
               max-[767px]:w-full max-[767px]:h-auto max-[767px]:text-[28px] max-[767px]:leading-[130%] max-[767px]:tracking-[-0.3px] max-[767px]:text-center
               min-[768px]:max-[1065px]:w-full min-[768px]:max-[1065px]:max-w-[525px] min-[768px]:max-[1065px]:h-auto min-[768px]:max-[1065px]:text-center min-[768px]:max-[1065px]:mx-auto">
        Learn to code by watching others
      </h1>
      <p class="text-[16px] leading-[165%] tracking-[0px] font-medium text-white">
        See how experienced developers solve problems in real-time.
        Watching scripted tutorials is great, but understanding how developers think is invaluable.
      </p>
    </section>

    <!-- 폼 영역 (오른쪽) -->
    <section aria-label="Sign up" class="w-full
             max-[767px]:min-w-0 max-[767px]:box-border
             min-[768px]:max-[1065px]:w-full min-[768px]:max-[1065px]:max-w-[540px] min-[768px]:max-[1065px]:min-w-0 min-[768px]:max-[1065px]:box-border min-[768px]:max-[1065px]:flex min-[768px]:max-[1065px]:flex-col min-[768px]:max-[1065px]:items-center
             min-[1066px]:w-[540px] min-[1066px]:ml-auto">

      <!-- 프로모션 배너 -->
      <aside aria-label="Promotion"
        class="w-[540px] h-[60px] bg-[#5E54A4] text-white rounded-[10px] shadow-[0_8px_0_rgba(0,0,0,0.15)] mb-6 flex items-center justify-center text-center
               min-[768px]:max-[1065px]:w-full min-[768px]:max-[1065px]:min-w-0 min-[768px]:max-[1065px]:max-w-full min-[768px]:max-[1065px]:box-border
               max-[767px]:w-full max-[767px]:min-w-0 max-[767px]:box-border max-[767px]:px-[66.5px] max-[767px]:py-[18px] max-[767px]:h-[88px]">
        <p class="m-0"><strong>Try it free 7 days</strong> then $20/mo. thereafter</p>
      </aside>

      <!-- 회원가입 폼 -->
      <form
        class="bg-white rounded-[10px] py-8 px-10 flex flex-col gap-6 shadow-[0_8px_0_rgba(0,0,0,0.1)] box-border
               max-[767px]:w-full max-[767px]:min-w-0 max-[767px]:p-6
               min-[768px]:max-[1065px]:w-full min-[768px]:max-[1065px]:min-w-0 min-[768px]:max-[1065px]:max-w-full min-[768px]:max-[1065px]:mx-auto"
        action="#" method="post">
        <input type="text" placeholder="First Name" required aria-label="First Name" class="w-[460px] max-w-full h-[56px] box-border border border-[#DEDEDE] rounded-lg py-4 px-8 font-sans text-[15px] font-normal tracking-[0.25px] text-[#3D3B48] placeholder:text-[#BAB7D4] focus:outline-none focus:border-2 focus:border-[#5E54A4]
                 max-[767px]:w-full
                 min-[768px]:max-[1065px]:w-full min-[768px]:max-[1065px]:max-w-[460px]">
        <input type="text" placeholder="Last Name" required aria-label="Last Name" class="w-[460px] max-w-full h-[56px] box-border border border-[#DEDEDE] rounded-lg py-4 px-8 font-sans text-[15px] font-normal tracking-[0.25px] text-[#3D3B48] placeholder:text-[#BAB7D4] focus:outline-none focus:border-2 focus:border-[#5E54A4]
                 max-[767px]:w-full
                 min-[768px]:max-[1065px]:w-full min-[768px]:max-[1065px]:max-w-[460px]">
        <input type="email" placeholder="Email Address" required aria-label="Email Address" class="w-[460px] max-w-full h-[56px] box-border border border-[#DEDEDE] rounded-lg py-4 px-8 font-sans text-[15px] font-normal tracking-[0.25px] text-[#3D3B48] placeholder:text-[#BAB7D4] focus:outline-none focus:border-2 focus:border-[#5E54A4]
                 max-[767px]:w-full
                 min-[768px]:max-[1065px]:w-full min-[768px]:max-[1065px]:max-w-[460px]">
        <input type="password" placeholder="Password" required aria-label="Password" class="w-[460px] max-w-full h-[56px] box-border border border-[#DEDEDE] rounded-lg py-4 px-8 font-sans text-[15px] font-normal tracking-[0.25px] text-[#3D3B48] placeholder:text-[#BAB7D4] focus:outline-none focus:border-2 focus:border-[#5E54A4]
                 max-[767px]:w-full
                 min-[768px]:max-[1065px]:w-full min-[768px]:max-[1065px]:max-w-[460px]">
        <button type="submit" class="w-[460px] max-w-full h-[56px] bg-[#38CC8B] text-white rounded-lg border-0 shadow-[inset_0_-4px_0_rgba(0,0,0,0.0909)] font-sans text-[15px] leading-[175%] font-semibold tracking-[2px] uppercase cursor-pointer hover:bg-[#77E2B3] box-border
                 max-[767px]:w-full
                 min-[768px]:max-[1065px]:w-full min-[768px]:max-[1065px]:max-w-[460px]">
          Claim your free trial
        </button>
        <p class="m-0 mt-[-16px] text-center text-[11px] leading-[190%] font-medium text-[#BAB7D4]">
          By clicking the button, you are agreeing to our
          <a href="#" class="text-[#FF7979] no-underline font-semibold border-b border-[#FF7979] hover:underline">Terms
            and Services</a>
        </p>
      </form>

    </section>

  </main>

</body>

</html>
